        - 360p
        - 480p
        - 720p
        - 1080p
        - 4k
        - auto
        description: 画质等级
      rate:
        type: number
        enum:
        - 0.75
        - 1.0
        - 1.25
        - 1.5
        - 2.0
        description: 播放倍速
      direction:
        type: string
        enum:
        - slower
        - faster
        - fastest
        - slowest
        - normal
        description: 倍速调整方向
      soundEffect:
        type: string
        enum:
        - none
        - 3d_surround
        - car_exclusive
        - panoramic
        - vinyl
        - hifi_live
        - pure_vocal
        - heavy_bass
        - custom
        description: 音效模式
      autoSkip:
        type: boolean
        description: 跳过片头片尾开关（有声书/播客适用）
      sortOrder:
        type: string
        enum:
        - asc
        - desc
        description: 列表排序方向：正序/倒序（有声书适用）
      controlArea:
        type: string
        enum:
        - csd
        - psd
        - rsd
        description: 控制区域
    required:
    - settingType
    additionalProperties: false
