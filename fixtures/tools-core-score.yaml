# PoC 自有 registry：由 fixtures/core_tool_schemas_score.json 转换（242 tools / 17 domains）。
# 不依赖上游 tools.yaml / tools-multidomain.yaml。binding 全为 mock；side_effect 按 spec §3 规则生成。
tools:
- name: car_adas_control
  domain: adas
  description: 启用或取消智能驾驶辅助功能
  binding: mock
  side_effect: non_idempotent
  parameters:
    type: object
    properties:
      action:
        type: string
        enum:
        - enable
        - disable
    required:
    - action
    additionalProperties: false
- name: car_adas_cruiseSpeed
  domain: adas
  description: 设置智驾巡航速度
  binding: mock
  side_effect: non_idempotent
  parameters:
    type: object
    properties:
      speed:
        type: number
        description: 巡航速度
    required:
    - speed
    additionalProperties: false
- name: car_adas_cruiseTimeDistance
  domain: adas
  description: 设置智驾跟车距离
  binding: mock
  side_effect: non_idempotent
  parameters:
    type: object
    properties:
      distance:
        type: string
        enum:
        - near
        - medium
        - far
    required:
    - distance
    additionalProperties: false
- name: alipay_login
  domain: alipay
  description: 支付宝账号一键登录授权
  binding: mock
  side_effect: non_idempotent
  parameters:
    type: object
